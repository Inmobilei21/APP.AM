<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marta Wellness</title>
  <meta name="description" content="Entrenamiento, progreso semanal, dieta y lista de la compra.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Marta W.">
  <link rel="manifest" href="/marta/manifest.webmanifest?v=1">
  <link rel="icon" type="image/png" href="/marta/favicon.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/marta/apple-touch-icon.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/marta/styles.css?v=1">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="mw-logo" viewBox="0 0 120 120">
        <rect width="120" height="120" rx="28" fill="#efe6da"/>
        <circle cx="60" cy="60" r="41" fill="none" stroke="#141210" stroke-width="1"/>
        <text x="60" y="73" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="40" font-weight="500" fill="#141210" letter-spacing="-1">M<tspan font-style="italic" font-weight="400" dx="-3">W</tspan></text>
        <text x="60" y="91" text-anchor="middle" font-family="Jost, Arial, sans-serif" font-size="6.5" letter-spacing="2.4" fill="#6d655c">WELLNESS</text>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <main class="screen" id="screen"></main>
    <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  </div>
  <div class="sheet-backdrop" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="photo-input" accept="image/*" hidden>
  <input type="file" id="backup-input" accept="application/json,.json" hidden>

  <script src="/marta/data.js?v=1"></script>
  <script src="/marta/app.js?v=1"></script>
</body>
</html>
