<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Presupuesto · Asesoría Molinero</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e1835;--blue:#18299b;--ink:#172033;--muted:#6f7787;--line:#e6e9f0;--soft:#f5f7fb;--ok:#0f7a4a;--okbg:#e8f6ee}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(120deg,#0b1430 0%,#13235c 100%);height:180px}
.card{position:relative}.card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--blue) 0 26%,var(--navy) 26%)}
.wrap{max-width:820px;margin:-120px auto 60px;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(14,24,53,.10);overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px 36px;border-bottom:1px solid var(--line)}
.logos{display:flex;align-items:center;gap:18px}.logos img{height:44px;width:auto;display:block}.logos .pp{height:22px;padding-left:18px;border-left:1px solid var(--line)}
.num{text-align:right}.num small{display:block;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--blue)}.num b{display:block;font-size:20px;color:var(--navy);margin-top:3px}.num span{font-size:13px;color:var(--muted)}
.body{padding:30px 36px 34px}
.meta{display:grid;grid-template-columns:1fr auto;gap:16px;margin-bottom:30px;padding:18px 20px;border-radius:14px;background:var(--soft)}
.label{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
.meta .v{font-weight:700;color:var(--navy);font-size:16px}.meta .s{color:var(--muted);font-size:13px;margin-top:2px}.meta .r{text-align:right}
h1{font-size:28px;line-height:1.2;color:var(--navy);margin:0 0 22px;letter-spacing:-.01em}h1::before{content:"";display:block;width:30px;height:3px;border-radius:2px;background:var(--blue);margin-bottom:12px}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--navy);font-weight:700;text-align:left;padding:10px 14px}th:first-child{border-radius:9px 0 0 9px}th:last-child{border-radius:0 9px 9px 0}td:first-child{padding-left:14px}td:last-child{padding-right:14px}
th:last-child,td:last-child{text-align:right}td{padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:top}td:last-child{white-space:nowrap;padding-left:20px;font-variant-numeric:tabular-nums}
.totals{margin:16px 0 0 auto;width:min(300px,100%)}.totals div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}.totals div span:last-child{color:var(--ink)}
.totals .t{margin-top:10px;padding:14px 16px;border-radius:12px;background:var(--navy);color:#c7d0f2;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;align-items:center}.totals .t span:last-child{color:#fff;font-size:22px;letter-spacing:0;font-weight:800;text-transform:none}
section{margin-top:32px}
.pays{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pays div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;font-size:14px}.pays b{color:var(--blue);font-size:18px}
.pays em{font-style:normal;color:var(--muted);font-size:13px;margin-left:auto;margin-right:16px}.pays b{font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--okbg);color:var(--ok);margin-left:8px}
.chip.wait{background:#fff5e6;color:#9a5b00}
.note{color:var(--muted);font-size:13.5px;line-height:1.55;margin:12px 0 0;white-space:pre-line}
ol{margin:0;padding-left:20px;color:#4b5468;font-size:13px;line-height:1.6}ol li{margin:0 0 6px}
.accept{margin-top:34px;padding:26px;border-radius:18px;background:var(--soft);border:1px solid var(--line)}
.accept h2,.done h2{margin:0 0 6px;font-size:19px;color:var(--navy)}.accept p{margin:0 0 18px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:#3e4960}
label.f input{height:46px;border:1px solid #d6dbe6;border-radius:12px;padding:0 14px;font:inherit;font-size:15px;font-weight:500;background:#fff;color:var(--ink)}
label.f input:focus{outline:2px solid #c7d0f5;border-color:var(--blue)}
.check{display:flex;gap:11px;align-items:flex-start;margin:18px 0;font-size:14px;line-height:1.5;color:#2b3448;cursor:pointer}.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--blue);flex:none}
button.go{width:100%;height:54px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
button.go:hover{background:var(--blue)}button.go:disabled{opacity:.55;cursor:default}
.err{color:#b42318;font-size:13.5px;margin:10px 0 0;min-height:1em}
.done{margin-top:34px;padding:26px;border-radius:18px;background:var(--okbg);border:1px solid #bfe5cf}
.done p{margin:0;color:#2b4b3a;font-size:14.5px;line-height:1.55}.done .pay{margin-top:16px;padding:16px;border-radius:14px;background:#fff;border:1px solid #d5ecdf}
.done .pay b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.links a{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:600;font-size:13.5px;text-decoration:none}.links a:hover{border-color:var(--blue)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6}
.msg{padding:60px 30px;text-align:center;color:var(--muted)}.msg b{display:block;color:var(--navy);font-size:19px;margin-bottom:8px}
@media(max-width:620px){.head{flex-direction:column;align-items:flex-start;padding:22px}.num{text-align:left}.body{padding:22px}.meta{grid-template-columns:1fr}.meta .r{text-align:left}h1{font-size:23px}.grid{grid-template-columns:1fr}.pays em{display:none}.accept,.done{padding:18px}}
</style>
</head>
<body>
<div class="top"></div>
<main class="wrap"><div class="card" id="card"><div class="msg"><b>Cargando el presupuesto…</b></div></div><p class="foot" id="foot"></p></main>
<script>
(function(){
  const token=new URLSearchParams(location.search).get("t")||"";
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const eur=v=>`${(Number(v)||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:"always"})} €`;
  const day=iso=>new Date(iso).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
  const pdf=doc=>`/api/p/${encodeURIComponent(token)}/pdf${doc?`?doc=${doc}`:""}`;
  async function load(){
    try{const r=await fetch(`/api/p/${encodeURIComponent(token)}`,{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"No disponible");render(d)}
    catch(e){$("#card").innerHTML=`<div class="msg"><b>Presupuesto no disponible</b>${esc(e.message)}</div>`}
  }
  function render(d){
    document.title=`Presupuesto ${d.numero} · ${d.despacho.nombre}`;
    const anticipo=d.pagos[0],pendiente=d.pagos.find(p=>p.estado!=="pagado");
    const payList=d.pagos.map(p=>`<div><span>${esc(p.etiqueta)}${p.estado==="pagado"?`<span class="chip">Pagado</span>`:""}</span><em>${String(p.pct).replace(".",",")} %</em><b>${eur(p.importe)}</b></div>`).join("");
    const conds=String(d.condiciones||"").split("\n").map(s=>s.trim()).filter(Boolean);
    let action="";
    if(d.aceptacion){
      const toPay=d.pagoFinalPedido?pendiente:(anticipo&&anticipo.estado!=="pagado"?anticipo:null);
      action=`<div class="done"><h2>Presupuesto aceptado</h2><p>Aceptado por ${esc(d.aceptacion.nombre)} el ${esc(day(d.aceptacion.fecha))}. Gracias por tu confianza.</p>${toPay?`<div class="pay"><b>${esc(toPay.etiqueta)}: ${eur(toPay.importe)}</b><p class="note">${esc(d.pagoInstrucciones||"El despacho te indicará cómo realizar el pago.")}</p></div>`:d.pagos.every(p=>p.estado==="pagado")?`<div class="pay"><b>Pagos completados</b><p class="note">Hemos recibido todos los pagos de este presupuesto.</p></div>`:`<div class="pay"><b>Anticipo recibido</b><p class="note">Ya estamos trabajando en tu encargo. Te avisaremos al terminar para el pago final.</p></div>`}<div class="links"><a href="${pdf()}" target="_blank" rel="noopener">⤓ Presupuesto (PDF)</a><a href="${pdf("acuerdo")}" target="_blank" rel="noopener">⤓ Justificante de aceptación (PDF)</a></div></div>`;
    }else if(d.estado==="rechazado"){action=`<div class="accept"><h2>Presupuesto cerrado</h2><p>Este presupuesto ya no está disponible. Si lo necesitas, ponte en contacto con el despacho.</p></div>`}
    else if(d.caducado){action=`<div class="accept"><h2>Presupuesto caducado</h2><p>Su validez terminó el ${esc(day(d.vence))}. Ponte en contacto con el despacho y te lo renovamos.</p></div>`}
    else action=`<form class="accept" id="acceptForm" novalidate><h2>Aceptar el presupuesto</h2><p>Para iniciar el encargo, indica tus datos y acepta el presupuesto. ${anticipo?`Después te indicaremos cómo abonar el anticipo de <b>${eur(anticipo.importe)}</b>.`:""}</p>
      <div class="grid"><label class="f">Nombre y apellidos<input name="nombre" autocomplete="name" required></label><label class="f">DNI / NIF<input name="dni" autocomplete="off" required></label><label class="f">Correo electrónico<input name="email" type="email" autocomplete="email"></label><label class="f">Teléfono<input name="telefono" type="tel" autocomplete="tel"></label></div>
      <label class="check"><input type="checkbox" name="acepto"><span>He leído y acepto el presupuesto ${esc(d.numero)}, su forma de pago y sus condiciones, y encargo a ${esc(d.despacho.nombre)} el inicio de los trabajos${d.cliente.nombre?` en nombre de ${esc(d.cliente.nombre)}`:""}.</span></label>
      <button class="go" type="submit">Aceptar presupuesto${anticipo?` · anticipo ${eur(anticipo.importe)}`:""}</button><p class="err" id="err"></p></form>`;
    $("#card").innerHTML=`<div class="head"><div class="logos"><img src="/brand/molinero.png" alt="Asesoría Molinero">${d.marca==="propymes"?'<img class="pp" src="/propymes/logo-arena-horizontal.png" alt="ProPymes">':""}</div><div class="num"><small>PRESUPUESTO</small><b>${esc(d.numero)}</b><span>${esc(day(d.fecha))}</span></div></div>
    <div class="body"><div class="meta"><div><p class="label">Para</p><div class="v">${esc(d.cliente.nombre)}</div>${d.cliente.nif?`<div class="s">NIF ${esc(d.cliente.nif)}</div>`:""}</div><div class="r"><p class="label">Válido hasta</p><div class="v">${esc(day(d.vence))}</div></div></div>
    <h1>${esc(d.servicio)}</h1>
    <table><thead><tr><th>Concepto</th><th>Importe</th></tr></thead><tbody>${d.conceptos.map(c=>`<tr><td>${esc(c.descripcion)}</td><td>${eur(c.importe)}</td></tr>`).join("")}</tbody></table>
    <div class="totals"><div><span>Base imponible</span><span>${eur(d.base)}</span></div><div><span>${d.ivaPct?`IVA ${d.ivaPct} %`:"IVA (exento)"}</span><span>${eur(d.iva)}</span></div><div class="t"><span>Total</span><span>${eur(d.total)}</span></div></div>
    <section><p class="label">Forma de pago</p><div class="pays">${payList}</div></section>
    ${conds.length?`<section><p class="label">Condiciones</p><ol>${conds.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></section>`:""}
    ${action}
    ${d.aceptacion?"":`<div class="links"><a href="${pdf()}" target="_blank" rel="noopener">⤓ Descargar en PDF</a></div>`}</div>`;
    $("#foot").textContent=[d.despacho.nombre,d.despacho.nif&&`NIF ${d.despacho.nif}`,d.despacho.direccion,d.despacho.telefono,d.despacho.email,d.despacho.web].filter(Boolean).join(" · ");
    const form=$("#acceptForm");
    if(form)form.addEventListener("submit",async e=>{
      e.preventDefault();const f=new FormData(form),err=$("#err"),btn=form.querySelector("button");err.textContent="";
      const body={nombre:String(f.get("nombre")||"").trim(),dni:String(f.get("dni")||"").trim(),email:String(f.get("email")||"").trim(),telefono:String(f.get("telefono")||"").trim(),acepto:form.acepto.checked};
      if(!body.nombre||!body.dni){err.textContent="Indica tu nombre y tu DNI o NIF.";return}
      if(!body.acepto){err.textContent="Marca la casilla para aceptar el presupuesto.";return}
      btn.disabled=true;btn.textContent="Registrando la aceptación…";
      try{const r=await fetch(`/api/p/${encodeURIComponent(token)}/aceptar`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d2=await r.json();if(!r.ok)throw new Error(d2.error||"No se pudo aceptar");render(d2);window.scrollTo({top:document.querySelector(".done")?.offsetTop-20||0,behavior:"smooth"})}
      catch(x){err.textContent=x.message;btn.disabled=false;btn.textContent="Aceptar presupuesto"}
    });
  }
  load();
})();
</script>
</body>
</html>
